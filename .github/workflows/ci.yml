name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy packages tests
      - run: uv run --locked pytest
