[project]
name = "worker-mcp"
version = "0.1.0"
description = "Worker-side MCP client for agent-hub"
requires-python = ">=3.12"
dependencies = ["agent-hub-common"]

[project.scripts]
worker-mcp = "worker_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_mcp"]

[tool.uv.sources]
agent-hub-common = { workspace = true }
