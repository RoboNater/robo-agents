[project]
name = "agent-hub-workspace"
version = "0.1.0"
description = "Networked agent coordination proof of concept"
requires-python = ">=3.12"
dependencies = [
    "agent-hub",
    "agent-hub-common",
    "worker-mcp",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-hub = { workspace = true }
agent-hub-common = { workspace = true }
worker-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
