# Codex CLI ~/.codex/config.toml
# Replace /path/to/agent-hub with the absolute path to this checkout (e.g. C:/path/to/agent-hub on Windows).
# HUB_HARNESS_VERSION and HUB_MODEL are left empty (reported as "unknown"); fill them
# in when you pin them, e.g. from `codex --version` and the `model` you launch with.
[mcp_servers.hub]
command = "uv"
args = ["run", "--directory", "/path/to/agent-hub", "worker-mcp"]
# Codex CLI 0.154.0 fails an MCP tool call after 300 s by default (observed; spec §8).
# The default hold is 120 s, but a worker may request up to HUB_MAX_WAIT_S (300 s)
# and waits 15 s past the hold before giving up, so allow that with margin.
tool_timeout_sec = 330
env = { HUB_URL = "http://alice-host:8420", HUB_TOKEN = "...", AGENT_NAME = "charlie", HUB_HARNESS = "codex", HUB_HARNESS_VERSION = "", HUB_PROVIDER = "openai", HUB_MODEL = "", HUB_CAPABILITIES = "" }
